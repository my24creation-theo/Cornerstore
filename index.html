<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corner Store – UPI Checkout</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f5;--card:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d9e0e8;--acc:#f4a300;--ok:#1b7f5c;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#eef2f8;--mute:#9aa8c2;--line:#2a3856}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#eef2f8;--mute:#9aa8c2;--line:#2a3856}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:1100px;margin:auto;padding:16px 20px 6px}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}h2{margin:0 0 10px;font-size:1.1rem}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:8px 12px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);border-color:var(--acc);color:#14213d;font-weight:700;padding:11px}
.pri:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1100px;margin:auto;padding:10px 20px 40px}
.shop{display:grid;grid-template-columns:1fr 340px;gap:20px}@media(max-width:860px){.shop{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card,.p,aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.p{display:flex;flex-direction:column;gap:6px}.p .e{font-size:2rem}.p span,.mute{color:var(--mute);font-size:.85rem}
.p button{margin-top:auto;background:var(--ink);color:var(--bg);font-weight:600}
aside{align-self:start;position:sticky;top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0}
.q{display:flex;gap:6px;align-items:center}.q button{padding:2px 9px}
.sum{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}.tot{font-size:1.2rem;font-weight:700}
input,select,textarea{width:100%;padding:8px;margin-top:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
label{display:block;font-size:.85rem;color:var(--mute)}.err{color:var(--bad);font-size:.78rem;display:block;min-height:1em}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}@media(max-width:560px){.fg{grid-template-columns:1fr}}
dialog{border:none;border-radius:14px;padding:20px;max-width:560px;width:94%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,30,.6)}
.ctr{text-align:center}#qr{display:inline-block;background:#fff;padding:12px;border-radius:10px;margin:8px 0}
.amt{font-size:1.7rem;font-weight:700;color:var(--ok)}.small{color:var(--mute);font-size:.78rem;word-break:break-all}
.warn{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 10px;font-size:.85rem;margin:8px 0;text-align:left}
.link{display:block;margin:8px 0;padding:10px;border-radius:8px;background:var(--ok);color:#fff;text-decoration:none;font-weight:600}
.hide{display:none!important}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}tr.ck{cursor:pointer}tr.ck:hover{background:var(--bg)}
.badge{padding:2px 8px;border-radius:99px;font-size:.75rem;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stats b{display:block;font-size:1.3rem}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.bar{display:flex;align-items:center;gap:6px;font-size:.78rem;margin:3px 0}.bar i{display:block;height:10px;background:var(--acc);border-radius:4px;min-width:2px}.bar em{font-style:normal;min-width:70px}
.bars-f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bars-f>*{flex:1;min-width:130px}
.steps{list-style:none;padding:0;margin:10px 0}.steps li{padding:6px 0 6px 26px;position:relative;color:var(--mute)}
.steps li:before{content:"○";position:absolute;left:0}.steps li.d{color:var(--ink);font-weight:600}.steps li.d:before{content:"✓";color:var(--ok)}
.rc{max-width:560px;margin:auto}.rc table td:nth-child(n+2){text-align:right}.rc .t{font-weight:700}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;left:0;top:0;width:100%}}
</style></head><body>
<div class="top"><h1>Corner Store</h1>
<nav id="nav"><button data-v="shop">Shop</button><button data-v="orders">My orders &amp; tracking</button><button data-v="admin">Admin</button></nav></div>
<div class="wrap">
<section id="v-shop" class="shop"><div><div class="grid" id="grid"></div></div>
<aside aria-live="polite"><h2>Your cart</h2><div id="cart"></div><div class="sum" id="sum"></div>
<button class="pri" id="co" style="width:100%;margin-top:10px" disabled>Checkout</button></aside></section>

<section id="v-confirm" class="hide"><div class="card rc"><h2 id="cTitle"></h2><div class="warn" id="cWarn"></div><div id="receipt"></div>
<div class="bars-f" style="margin-top:12px"><button id="bPrint">Print order</button><button id="bDl">Download receipt</button><a id="bWa" class="pri" style="text-decoration:none;display:inline-block;border-radius:8px;padding:9px 12px" target="_blank" rel="noopener noreferrer" href="#">Send order on WhatsApp</a><button id="bCopy">Copy order text</button><button id="bTrack">Track order</button><button id="bCont">Continue shopping</button></div></div></section>

<section id="v-orders" class="hide"><div class="card"><h2>Track my order</h2>
<div class="bars-f"><input id="tId" placeholder="Order ID e.g. CS-20261003-8F42K"><button class="pri" id="tGo">Track</button></div><div id="tOut"></div></div>
<div class="card" style="margin-top:12px"><h2>Order history on this browser</h2><div id="hist"></div></div></section>

<section id="v-admin" class="hide">
<div class="card" id="aLogin"><h2>Admin login</h2><label>Password<input id="aPw" type="password" autocomplete="off"></label>
<span class="err" id="aErr"></span><button class="pri" id="aGo">Log in</button><p class="mute">Demo password: admin123 (client-side only – not real security).</p></div>
<div id="aDash" class="hide"><div class="stats" id="stats"></div>
<div class="card"><div class="bars-f"><input id="fq" placeholder="Search ID, name, mobile, email"><select id="fp"></select><select id="fs"></select><input id="fd" type="date" aria-label="Date">
<select id="fo"><option value="new">Newest</option><option value="old">Oldest</option><option value="hi">Highest value</option><option value="lo">Lowest value</option></select></div>
<div class="tw"><table><thead><tr><th>Order ID</th><th>Customer</th><th>Phone</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead><tbody id="ot"></tbody></table></div></div>
<div class="charts" id="charts"></div><button id="aOut">Log out</button></div></section>
</div>

<dialog id="dForm"><h2>Customer details</h2><form id="form" novalidate><div class="fg" id="fields"></div>
<div class="sum" id="fsum"></div><label style="margin-top:10px"><input type="checkbox" id="consent" style="width:auto"> I agree that my order details may be shared with Corner Store by WhatsApp, email and Google Sheets.</label><span class="err" id="e-consent"></span><div class="bars-f" style="margin-top:10px"><button type="button" id="fx">Back to cart</button><button class="pri" type="submit" id="fgo">Proceed to payment</button></div></form></dialog>

<dialog id="dPay"><div class="ctr"><h2>Scan to pay</h2><div class="amt" id="pAmt"></div><div class="small" id="pId"></div>
<div id="qr"></div><a class="link" id="pLink" href="#">Open in UPI app</a><div class="small" id="pUri"></div>
<div class="warn" id="pWarn"></div>
<div class="bars-f"><button id="pClose">Pay later</button><button class="pri" id="pDone">I have completed the payment</button></div></div></dialog>

<dialog id="dOrd"><div id="oBody"></div><div class="bars-f" style="margin-top:10px"><button id="oX">Close</button></div></dialog>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== CONFIG: MODE "demo" works standalone. MODE "real" needs the backend described in the notes. ===== */
const CFG={MODE:"demo",API:"",VPA:"8870063826@upi",WA:"918870063826",WEB3FORMS_KEY:"6ccd55ad-aa70-40d4-b34a-daaa0ebc4264",SHEET_URL:"https://script.google.com/macros/s/AKfycbxcOu0wNaK0I_-R9Uc2L75VsEnjIRJF4KoWRDFk7vFPRqjq_sjWAt84OsPDM1s5HYU/exec",NAME:"Corner Store",GST:.18,SHIP:50};
const PRODUCTS=[{id:1,n:"Notebook",p:60,e:"📓"},{id:2,n:"Gel Pen Pack",p:90,e:"🖊️"},{id:3,n:"Steel Bottle",p:350,e:"🍶"},{id:4,n:"Tea 250g",p:140,e:"🍵"},{id:5,n:"Backpack",p:899,e:"🎒"},{id:6,n:"Earphones",p:499,e:"🎧"},{id:7,n:"Desk Lamp",p:640,e:"💡"},{id:8,n:"Cotton Towel",p:220,e:"🧺"},{id:9,n:"Snack Box",p:180,e:"🍪"},{id:10,n:"Phone Stand",p:150,e:"📱"}];
const OSTAT=["Order Received","Processing","Packed","Shipped","Out for Delivery","Delivered","Cancelled"];
const PSTAT=["Pending","Demo Payment Submitted","Paid","Failed","Refunded"];
const STEPS=["Order Received","Payment Confirmed","Order Processing","Packed","Shipped","Out for Delivery","Delivered"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
let mem=[],cart={},admin=false,cur=null,poll=null;
function load(){try{return JSON.parse(localStorage.getItem("cornerStoreOrders")||"[]")}catch(e){return mem}}
function save(a){mem=a;try{localStorage.setItem("cornerStoreOrders",JSON.stringify(a))}catch(e){}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("s");setTimeout(()=>e.classList.remove("s"),2600)}
function calc(items){const sub=r2(items.reduce((s,i)=>s+i.price*i.qty,0)),gst=r2(sub*CFG.GST),shipping=sub>0?CFG.SHIP:0;return{subtotal:sub,gst,shipping,total:r2(sub+gst+shipping)}}
const cartItems=()=>Object.keys(cart).map(id=>{const p=PRODUCTS.find(x=>x.id==id);return{id:p.id,name:p.n,price:p.p,qty:cart[id]}});
const dt=o=>new Date(o.createdAt);

/* ===== views ===== */
function show(v){["shop","confirm","orders","admin"].forEach(x=>$("v-"+x).classList.toggle("hide",x!==v));
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 if(v==="orders")hist();if(v==="admin")adminRender();scrollTo(0,0)}
$("nav").onclick=e=>{if(e.target.dataset.v)show(e.target.dataset.v)};

/* ===== shop + cart ===== */
$("grid").innerHTML=PRODUCTS.map(x=>`<div class="p"><div class="e">${x.e}</div><b>${x.n}</b><span>${inr(x.p)}</span><button data-id="${x.id}">Add to cart</button></div>`).join("");
$("grid").onclick=e=>{const id=e.target.dataset.id;if(id){cart[id]=(cart[id]||0)+1;renderCart()}};
$("cart").onclick=e=>{const id=e.target.dataset.id,d=+e.target.dataset.d;if(!id)return;cart[id]=d===0?0:cart[id]+d;if(cart[id]<=0)delete cart[id];renderCart()};
function sumHTML(items){const t=calc(items);return `<div class="row"><span>Subtotal</span><span>${inr(t.subtotal)}</span></div><div class="row"><span>GST (18%)</span><span>${inr(t.gst)}</span></div><div class="row"><span>Shipping</span><span>${inr(t.shipping)}</span></div><div class="row tot"><span>Total</span><span>${inr(t.total)}</span></div>`}
function renderCart(){const it=cartItems();
 $("cart").innerHTML=it.length?it.map(i=>`<div class="row"><span>${esc(i.name)}<br><span class="mute">${inr(i.price)}</span></span><span class="q"><button data-id="${i.id}" data-d="-1" aria-label="Decrease ${esc(i.name)}">−</button>${i.qty}<button data-id="${i.id}" data-d="1" aria-label="Increase ${esc(i.name)}">+</button><button data-id="${i.id}" data-d="0" aria-label="Remove ${esc(i.name)}">✕</button></span></div>`).join(""):`<p class="mute">Your cart is empty. Add something from the left.</p>`;
 $("sum").innerHTML=it.length?sumHTML(it):"";$("co").disabled=!it.length}

/* ===== customer details ===== */
const FIELDS=[["name","Full name","text",v=>v.length>=2,"Enter your full name"],["mobile","Mobile number","tel",v=>/^[6-9]\d{9}$/.test(v),"Enter a valid 10-digit Indian mobile number"],["email","Email address","email",v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v),"Enter a valid email address"],["house","House / flat / door number","text",v=>v.length>0,"Required"],["street","Street / area","text",v=>v.length>2,"Required"],["city","City","text",v=>v.length>1,"Required"],["state","State","text",v=>v.length>1,"Required"],["pin","PIN code","text",v=>/^[1-9]\d{5}$/.test(v),"Enter a valid 6-digit PIN code"],["note","Delivery instructions (optional)","text",()=>true,""]];
$("fields").innerHTML=FIELDS.map(f=>`<div><label>${f[1]}<input id="f-${f[0]}" type="${f[2]}" autocomplete="off"></label><span class="err" id="e-${f[0]}"></span></div>`).join("");
$("co").onclick=()=>{$("fsum").innerHTML=sumHTML(cartItems());$("dForm").showModal()};
$("fx").onclick=()=>$("dForm").close();
$("form").onsubmit=async e=>{e.preventDefault();let ok=true,d={};
 FIELDS.forEach(f=>{const v=$("f-"+f[0]).value.trim();d[f[0]]=v;const good=f[3](v);$("e-"+f[0]).textContent=good?"":f[4];if(!good)ok=false});
 $("e-consent").textContent=$("consent").checked?"":"Please tick to continue";if(!$("consent").checked)ok=false;
 if(!ok){toast("Please fix the highlighted fields");return}
 $("fgo").disabled=true;$("fgo").textContent="Creating order…";
 try{const o=await createOrder(d);notify(o);cart={};renderCart();$("dForm").close();showPay(o)}
 catch(err){toast("Could not create order: "+err.message)}
 $("fgo").disabled=false;$("fgo").textContent="Proceed to payment"};

/* ===== order creation (DEMO local / REAL via backend) ===== */
function newId(orders){let id;const d=new Date(),ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 do{id="CS-"+ds+"-"+Math.random().toString(36).slice(2,7).toUpperCase()}while(orders.some(o=>o.orderId===id));return id}
async function createOrder(d){const items=cartItems();
 if(CFG.MODE==="real"){ /* backend recalculates prices and totals; browser totals are ignored */
  const r=await fetch(CFG.API+"/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer:d,items:items.map(i=>({id:i.id,qty:i.qty}))})});
  if(!r.ok)throw new Error("server "+r.status);const o=await r.json();const a=load();a.push(o);save(a);return o}
 const a=load(),t=calc(items);
 const o={orderId:newId(a),customer:d.name,mobile:d.mobile,email:d.email,address:{house:d.house,street:d.street,city:d.city,state:d.state,pin:d.pin},instructions:d.note,products:items,...t,paymentStatus:"Pending",orderStatus:"Payment Pending",createdAt:new Date().toISOString(),mode:"demo"};
 a.push(o);save(a);return o}
function upi(o){return "upi://pay?"+new URLSearchParams({pa:CFG.VPA,pn:CFG.NAME,am:o.total.toFixed(2),cu:"INR",tn:"Order "+o.orderId,tr:o.orderId})}

/* ===== order notifications: WhatsApp text, email (Web3Forms), Google Sheet (Apps Script) ===== */
function orderText(o){const a=o.address;return `New order ${o.orderId}\nCustomer: ${o.customer}\nMobile: ${o.mobile}\nEmail: ${o.email}\nAddress: ${a.house}, ${a.street}, ${a.city}, ${a.state} - ${a.pin}${o.instructions?"\nNote: "+o.instructions:""}\nItems:\n${o.products.map(i=>`- ${i.name} x${i.qty} = ${inr(i.price*i.qty)}`).join("\n")}\nSubtotal ${inr(o.subtotal)} | GST ${inr(o.gst)} | Shipping ${inr(o.shipping)}\nTOTAL ${inr(o.total)}\nPayment: ${o.paymentStatus} (not verified - check GPay history for ${o.orderId})`}
function notify(o){const t=orderText(o);
 if(CFG.WEB3FORMS_KEY)fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_key:CFG.WEB3FORMS_KEY,subject:"Corner Store order "+o.orderId+" - "+o.paymentStatus,from_name:"Corner Store",message:t})}).catch(()=>{});
 if(CFG.SHEET_URL)fetch(CFG.SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({orderId:o.orderId,createdAt:o.createdAt,customer:o.customer,mobile:o.mobile,email:o.email,address:Object.values(o.address).join(", "),instructions:o.instructions,items:o.products.map(i=>i.name+" x"+i.qty).join(", "),subtotal:o.subtotal,gst:o.gst,shipping:o.shipping,total:o.total,paymentStatus:o.paymentStatus,orderStatus:o.orderStatus})}).catch(()=>{})}

/* ===== payment ===== */
function showPay(o){cur=o;const u=upi(o);$("pAmt").textContent=inr(o.total);$("pId").textContent="Order "+o.orderId;
 $("qr").innerHTML="";new QRCode($("qr"),{text:u,width:210,height:210,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M});
 $("pLink").href=u;$("pUri").textContent=u;
 const real=CFG.MODE==="real";
 $("pWarn").textContent=real?"Waiting for the payment gateway to confirm. This page updates automatically.":"Demo mode: Payment has not been independently verified. Pay in your UPI app first, then press the button.";
 $("pDone").classList.toggle("hide",real);
 $("dPay").showModal();
 if(real){clearInterval(poll);poll=setInterval(async()=>{try{const r=await fetch(CFG.API+"/api/orders/"+o.orderId+"/status");const s=await r.json();
  if(s.paymentStatus==="Paid"||s.paymentStatus==="Failed"){clearInterval(poll);const a=load(),i=a.findIndex(x=>x.orderId===o.orderId);if(i>=0){a[i].paymentStatus=s.paymentStatus;a[i].orderStatus=s.orderStatus;save(a);$("dPay").close();showConfirm(a[i])}}}catch(e){}},3000)}}
$("pDone").onclick=()=>{const a=load(),i=a.findIndex(x=>x.orderId===cur.orderId);if(i<0)return;
 a[i].paymentStatus="Demo Payment Submitted";a[i].orderStatus="Order Received";save(a);notify(a[i]);$("dPay").close();showConfirm(a[i])};
$("pClose").onclick=()=>{clearInterval(poll);$("dPay").close();toast("Order saved as Payment Pending. Find it under My orders.");show("orders")};

/* ===== confirmation + receipt ===== */
function receipt(o){const dd=dt(o),ad=o.address;
 return `<div class="rc"><h2>${CFG.NAME}</h2><div class="row"><span>Order ID</span><b>${esc(o.orderId)}</b></div>
 <div class="row"><span>Date / time</span><span>${dd.toLocaleDateString("en-IN")} ${dd.toLocaleTimeString("en-IN")}</span></div>
 <div class="row"><span>Customer</span><span>${esc(o.customer)}</span></div><div class="row"><span>Contact</span><span>${esc(o.mobile)} · ${esc(o.email)}</span></div>
 <table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Amount</th></tr></thead><tbody>${o.products.map(i=>`<tr><td>${esc(i.name)}</td><td>× ${i.qty}</td><td>${inr(i.price)}</td><td>${inr(i.price*i.qty)}</td></tr>`).join("")}</tbody></table>
 <div class="row"><span>Subtotal</span><span>${inr(o.subtotal)}</span></div><div class="row"><span>GST</span><span>${inr(o.gst)}</span></div><div class="row"><span>Shipping</span><span>${inr(o.shipping)}</span></div>
 <div class="row tot"><span>Total</span><span>${inr(o.total)}</span></div>
 <div class="row"><span>Payment</span><b>${esc(o.paymentStatus)}</b></div><div class="row"><span>Order status</span><b>${esc(o.orderStatus)}</b></div>
 <p><b>Delivery address</b><br>${esc(ad.house)}, ${esc(ad.street)}<br>${esc(ad.city)}<br>${esc(ad.state)} – ${esc(ad.pin)}${o.instructions?`<br><i>Note: ${esc(o.instructions)}</i>`:""}</p>
 <p class="mute">Thank you for shopping with Corner Store!</p></div>`}
function showConfirm(o){cur=o;$("bWa").href="https://wa.me/"+CFG.WA+"?text="+encodeURIComponent(orderText(o));const demo=o.paymentStatus!=="Paid";
 $("cTitle").textContent=demo?"Order submitted":"Order confirmed";
 $("cWarn").textContent=demo?"Demo mode: Payment has not been independently verified.":"Payment verified by the payment gateway.";
 $("cWarn").classList.toggle("hide",!demo);$("receipt").innerHTML=receipt(o);show("confirm")}
$("bPrint").onclick=()=>print();
$("bDl").onclick=()=>{const h=`<!DOCTYPE html><meta charset="utf-8"><title>Receipt ${esc(cur.orderId)}</title><body style="font-family:sans-serif;max-width:560px;margin:auto">${receipt(cur)}</body>`;
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download="receipt-"+cur.orderId+".html";a.click();toast("Receipt downloaded (open it and print to save as PDF)")};
$("bTrack").onclick=()=>{show("orders");$("tId").value=cur.orderId;track()};
$("bCont").onclick=()=>show("shop");
$("bCopy").onclick=()=>{const t=orderText(cur);const fb=()=>{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");toast("Order text copied. Paste it in WhatsApp.")}catch(e){toast("Copy failed")}x.remove()};
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Order text copied. Paste it in WhatsApp.")).catch(fb);else fb()};

/* ===== tracking + history ===== */
function stepIdx(o){const m={"Order Received":0,Processing:2,Packed:3,Shipped:4,"Out for Delivery":5,Delivered:6};return o.orderStatus in m?m[o.orderStatus]:-1}
function track(){const id=$("tId").value.trim().toUpperCase(),o=load().find(x=>x.orderId===id);
 if(!o){$("tOut").innerHTML=`<p class="err">No order found with that ID in this browser.</p>`;return}
 const k=stepIdx(o),paid=o.paymentStatus==="Paid"||k>=2;
 $("tOut").innerHTML=`<p><b>Order found:</b> ${esc(o.orderId)} · ${inr(o.total)} · ${esc(o.paymentStatus)}</p>`+(o.orderStatus==="Cancelled"?`<p class="err">This order was cancelled.</p>`:o.orderStatus==="Payment Pending"?`<p class="mute">Waiting for payment.</p>`:"")+
 `<ul class="steps">${STEPS.map((s,i)=>`<li class="${(i===1?paid:i<=k)&&o.orderStatus!=="Cancelled"&&o.orderStatus!=="Payment Pending"?"d":""}">${s}</li>`).join("")}</ul>`}
$("tGo").onclick=track;
function hist(){const a=load().slice().reverse();
 $("hist").innerHTML=a.length?`<div class="tw"><table><thead><tr><th>Order</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>${a.map(o=>`<tr><td>${esc(o.orderId)}</td><td>${dt(o).toLocaleDateString("en-IN")}</td><td>${inr(o.total)}</td><td>${esc(o.paymentStatus)}</td><td>${esc(o.orderStatus)}</td><td><button data-v="${esc(o.orderId)}">View order</button>${o.paymentStatus==="Pending"?` <button data-p="${esc(o.orderId)}">Pay now</button>`:""}</td></tr>`).join("")}</tbody></table></div>`:`<p class="mute">No orders yet. Your orders will appear here after checkout.</p>`}
$("hist").onclick=e=>{const a=load();if(e.target.dataset.v){const o=a.find(x=>x.orderId===e.target.dataset.v);if(o)showConfirm(o)}
 if(e.target.dataset.p){const o=a.find(x=>x.orderId===e.target.dataset.p);if(o)showPay(o)}};

/* ===== admin ===== */
$("fp").innerHTML='<option value="">All payments</option>'+PSTAT.map(s=>`<option>${s}</option>`).join("");
$("fs").innerHTML='<option value="">All statuses</option>'+["Payment Pending",...OSTAT].map(s=>`<option>${s}</option>`).join("");
$("aGo").onclick=()=>{if($("aPw").value==="admin123"){admin=true;$("aPw").value="";adminRender()}else $("aErr").textContent="Wrong password"};
$("aOut").onclick=()=>{admin=false;adminRender()};
["fq","fp","fs","fd","fo"].forEach(id=>$(id).oninput=adminRender);
function bars(title,rows){const m=Math.max(1,...rows.map(r=>r[1]));return `<div class="card"><h2>${title}</h2>${rows.length?rows.map(r=>`<div class="bar"><em>${esc(r[0])}</em><i style="width:${Math.round(r[1]/m*100)}%"></i><span>${r[2]??r[1]}</span></div>`).join(""):'<p class="mute">No data yet</p>'}</div>`}
function adminRender(){$("aLogin").classList.toggle("hide",admin);$("aDash").classList.toggle("hide",!admin);if(!admin)return;
 const all=load(),paidSet=o=>["Paid","Demo Payment Submitted"].includes(o.paymentStatus)&&o.orderStatus!=="Cancelled";
 const sales=all.filter(paidSet).reduce((s,o)=>s+o.total,0),cnt=s=>all.filter(o=>o.orderStatus===s).length;
 const S=[["Total orders",all.length],["Total sales",inr(sales)],["Avg order value",inr(all.length?sales/Math.max(1,all.filter(paidSet).length):0)],["Pending payments",all.filter(o=>o.paymentStatus==="Pending").length],["Paid orders",all.filter(o=>o.paymentStatus==="Paid").length],["Processing",cnt("Processing")],["Shipped",cnt("Shipped")],["Delivered",cnt("Delivered")]];
 $("stats").innerHTML=S.map(s=>`<div class="card"><span class="mute">${s[0]}</span><b>${s[1]}</b></div>`).join("");
 const q=$("fq").value.trim().toLowerCase(),fd=$("fd").value;
 let L=all.filter(o=>(!q||[o.orderId,o.customer,o.mobile,o.email].some(x=>x.toLowerCase().includes(q)))&&(!$("fp").value||o.paymentStatus===$("fp").value)&&(!$("fs").value||o.orderStatus===$("fs").value)&&(!fd||o.createdAt.slice(0,10)===fd||new Date(o.createdAt).toLocaleDateString("en-CA")===fd));
 const so=$("fo").value;L.sort((a,b)=>so==="old"?a.createdAt.localeCompare(b.createdAt):so==="hi"?b.total-a.total:so==="lo"?a.total-b.total:b.createdAt.localeCompare(a.createdAt));
 $("ot").innerHTML=L.length?L.map(o=>`<tr class="ck" tabindex="0" data-o="${esc(o.orderId)}"><td>${esc(o.orderId)}</td><td>${esc(o.customer)}</td><td>${esc(o.mobile)}</td><td>${inr(o.total)}</td><td><span class="badge">${esc(o.paymentStatus)}</span></td><td><span class="badge">${esc(o.orderStatus)}</span></td><td>${dt(o).toLocaleDateString("en-IN")}</td></tr>`).join(""):`<tr><td colspan="7" class="mute">No orders match.</td></tr>`;
 const day={},rev={},prod={},st={};
 all.forEach(o=>{const k=new Date(o.createdAt).toLocaleDateString("en-CA");day[k]=(day[k]||0)+1;if(paidSet(o))rev[k]=(rev[k]||0)+o.total;o.products.forEach(p=>prod[p.name]=(prod[p.name]||0)+p.qty);st[o.orderStatus]=(st[o.orderStatus]||0)+1});
 const last=Object.keys(day).sort().slice(-7);
 $("charts").innerHTML=bars("Orders per day",last.map(k=>[k,day[k]]))+bars("Revenue per day",last.map(k=>[k,rev[k]||0,inr(rev[k]||0)]))+bars("Top-selling products",Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,5))+bars("Order status",Object.entries(st))}
$("ot").onclick=e=>{const tr=e.target.closest("tr[data-o]");if(tr)openOrd(tr.dataset.o)};
$("ot").onkeydown=e=>{if(e.key==="Enter"){const tr=e.target.closest("tr[data-o]");if(tr)openOrd(tr.dataset.o)}};
function openOrd(id){const o=load().find(x=>x.orderId===id);if(!o)return;const real=CFG.MODE==="real";
 $("oBody").innerHTML=receipt(o)+`<div class="fg"><label>Order status<select id="sOrd">${["Payment Pending",...OSTAT].map(s=>`<option ${s===o.orderStatus?"selected":""}>${s}</option>`).join("")}</select></label>
 <label>Payment status${real?" (set by gateway only)":""}<select id="sPay" ${real?"disabled":""}>${PSTAT.map(s=>`<option ${s===o.paymentStatus?"selected":""}>${s}</option>`).join("")}</select></label></div>`;
 $("dOrd").dataset.id=id;$("dOrd").showModal()}
$("oBody").onchange=e=>{const a=load(),i=a.findIndex(x=>x.orderId===$("dOrd").dataset.id);if(i<0)return;
 if(e.target.id==="sOrd")a[i].orderStatus=e.target.value;if(e.target.id==="sPay"&&CFG.MODE!=="real")a[i].paymentStatus=e.target.value;
 save(a);adminRender();toast("Order updated");$("oBody").querySelector(".rc").outerHTML=receipt(a[i])};
$("oX").onclick=()=>$("dOrd").close();
renderCart();show("shop");
</script></body></html>
